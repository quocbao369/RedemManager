<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RedemManager{% endblock %}</title>
    <link href="/static/css/style.css?v=20261107" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="3" width="20" height="14" rx="2"/>
                <path d="M8 21h8M12 17v4"/>
            </svg>
            <span>RedemManager</span>
        </div>
        <ul class="nav-links">
            <li><a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Overview</a></li>
            <li><a href="/instances" class="{% if request.url.path == '/instances' %}active{% endif %}">LDPlayer</a></li>
            <li><a href="/apps" class="{% if request.url.path == '/apps' %}active{% endif %}">Apps</a></li>
            <li><a href="/logs" class="{% if request.url.path == '/logs' %}active{% endif %}">Logs</a></li>
            <li><a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">Settings</a></li>
        </ul>
        <div class="nav-status">
            <span id="connection-status" class="status-indicator disconnected">
                <span class="dot"></span>
                Disconnected
            </span>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <span>RedemManager v1.0.0</span>
        <span id="server-time"></span>
    </footer>

    <script src="/static/js/app.js?v=20261108"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
