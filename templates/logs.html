{% extends "base.html" %}

{% block title %}Logs - RedemManager{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Logs</h1>
    <div class="header-actions">
        <span class="badge badge-success" id="log-live-badge" style="display:none;margin-right:8px">● LIVE</span>
        <label class="log-live-toggle">
            <input type="checkbox" id="log-auto-refresh" checked> Tự cập nhật (5s)
        </label>
        <button class="btn btn-secondary" onclick="exportLogs()">Export JSON</button>
        <button class="btn btn-secondary" onclick="clearLogs()">Clear View</button>
    </div>
</div>

<div class="card">
    <div class="log-filters">
        <div class="filter-group">
            <label>Workflow</label>
            <select id="log-filter-workflow">
                <option value="">All</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Instance</label>
            <select id="log-filter-instance">
                <option value="">All</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Level</label>
            <select id="log-filter-level">
                <option value="">All</option>
                <option value="DEBUG">DEBUG</option>
                <option value="INFO">INFO</option>
                <option value="WARNING">WARNING</option>
                <option value="ERROR">ERROR</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Limit</label>
            <input type="number" id="log-filter-limit" value="200" min="50" max="1000" step="50">
        </div>
        <button class="btn btn-primary" onclick="loadLogs()">Apply Filters</button>
        <button class="btn btn-secondary" onclick="resetLogFilters()">Reset</button>
    </div>

    <div class="log-viewer" id="log-content"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/logs.js?v=20261106"></script>
{% endblock %}
